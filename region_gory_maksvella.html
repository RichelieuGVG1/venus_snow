const $ = id => document.getElementById(id);
const cache = {};
function bytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function region(key){
  if(cache[key]) return cache[key];
  const R=D.regions[key], n=R.nr*R.nc;
  const e16=new Uint16Array(bytes(R.elev).buffer), elev=new Float32Array(n);
  for(let i=0;i<n;i++) elev[i]=R.emin+e16[i]/65535*(R.emax-R.emin);
  const em=bytes(R.emis), emis=new Float32Array(n);
  for(let i=0;i<n;i++) emis[i]=em[i]===255?NaN:em[i]/254;
  return cache[key]={R,n,elev,valid:bytes(R.valid),area:new Float32Array(bytes(R.area).buffer),emis,layers:{},snow:{}};
}
function layerVals(G,key){
  if(G.layers[key]) return G.layers[key];
  const q=bytes(G.R.layers[key]), L=D.layers[key], out=new Array(G.n);
  for(let i=0;i<G.n;i++) out[i]= q[i]===255?null:(L.categorical?q[i]:L.cmin+q[i]/254*(L.cmax-L.cmin));
  return G.layers[key]=out;
}
function snowVals(G,src){
  if(G.snow[src]) return G.snow[src];
  const q=bytes(G.R.snow[src]), out=new Float32Array(G.n);
  for(let i=0;i<G.n;i++) out[i]= q[i]===255?NaN:q[i]/254;
  return G.snow[src]=out;
}
function to2d(get,nr,nc){const o=new Array(nr);for(let r=0;r<nr;r++){const row=new Array(nc);for(let c=0;c<nc;c++)row[c]=get(r*nc+c);o[r]=row;}return o;}

  const lat=R.lat, lon=R.lon, mlat=lat.reduce((a,b)=>a+b,0)/lat.length;
  const xk=(Math.max(...lon)-Math.min(...lon))*D.km_per_deg*Math.cos(mlat*Math.PI/180);
  const yk=(Math.max(...lat)-Math.min(...lat))*D.km_per_deg, zk=Math.max(R.emax-R.emin,0.1)*exag, m=Math.max(xk,yk);

    {type:"contour",x:R.lon,y:R.lat,z:to2d(i=>isNaN(s[i])?0:s[i],nr,nc),contours:{start:thr,end:thr,size:1,coloring:"none"},

  Plotly.react("top",top,{title:{text:`${R.label}: вид сверху`,font:{color:"#eee",size:15},x:0.02},
    paper_bgcolor:"#05060a",plot_bgcolor:"#05060a",margin:{l:50,r:10,t:50,b:40},font:{color:"#ddd"},uirevision:key,
    xaxis:{title:"долгота, ° в.д.",color:"#ccc"},yaxis:{title:"широта, °",color:"#ccc",scaleanchor:"x",scaleratio:1/Math.cos(mlat*Math.PI/180)},
    legend:{orientation:"h",y:-0.2}},{responsive:true});

  const rows=[["регион",R.label],["максимальная высота",`${fmt(R.emax,2)} км`],
    ["снеговая линия h_c (ячейка 6)",R.snowline!==null?`${fmt(R.snowline,2)} км`:"не выделена"],
    [`площадь снега при p >= ${thr.toFixed(2)}`,`${fmt(Math.round(aS),0)} км^2`],
    ["доля региона под снегом",`${fmt(100*aS/Math.max(aV,1),2)} %`],
    ["площадь выше плоскости",plane?`${fmt(Math.round(aA),0)} км^2`:"плоскость скрыта"],
    ["излучательная способность выше и ниже плоскости",plane&&nA?`${fmt(eA/nA,3)} и ${nB?fmt(eB/nB,3):"нет данных"}`:"плоскость скрыта"]];

function fill(sel,opts,val){for(const [t,v] of opts){const o=document.createElement("option");o.textContent=t;o.value=v;sel.appendChild(o);}sel.value=val;}
