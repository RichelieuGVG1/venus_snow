<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Область Овда</title>

<style>
body{margin:0;background:#05060a;color:#ddd;font:14px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
#panel{display:flex;flex-wrap:wrap;gap:10px 18px;padding:12px 16px;background:#0d1018;border-bottom:1px solid #222a38}
#panel label{display:flex;align-items:center;gap:6px;white-space:nowrap}
select,input[type=range]{background:#1b1f2a;color:#ddd;border:1px solid #3a4050;border-radius:4px;padding:2px 4px}
input[type=range]{padding:0;width:140px}
.val{min-width:34px;color:#9fd}
#status{color:#888;margin-left:auto}
#main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;padding:8px}
#terrain{height:680px}#top{height:520px}
#stats td{padding:2px 10px}#stats td:first-child{color:#888}
@media (max-width:1000px){#main{grid-template-columns:1fr}}

 <span id="status"></span>
</div>

const cache = {};
function bytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function region(key){
  if(cache[key]) return cache[key];

  const q=bytes(G.R.layers[key]), L=D.layers[key], out=new Array(G.n);

function snowVals(G,src){

    contours:{z:{show:cont,start:Math.floor(R.emin),end:Math.ceil(R.emax),size:1,color:"rgba(0,0,0,0.45)",width:1}},
    name:"рельеф",visible:mode!=="snow"}];
  if($("show").checked && mode!=="relief" && layer!=="snow_prob" && layer!=="anomaly"){
    const off=0.02+0.01*(R.emax-R.emin);
    traces.push({type:"surface",x:R.lon,y:R.lat,z:to2d(i=>s[i]>=thr?G.elev[i]+off:null,nr,nc),
      surfacecolor:to2d(i=>s[i]>=thr?s[i]:null,nr,nc),colorscale:D.snow_scale,cmin:thr,cmax:1,showscale:false,
      hoverinfo:"skip",name:"снег",lighting:{ambient:0.8,diffuse:0.5,specular:0.5}});
  }
  if(plane){
    traces.push({type:"surface",x:[R.lon[0],R.lon[nc-1]],y:[R.lat[0],R.lat[nr-1]],z:[[level,level],[level,level]],
      colorscale:[[0,"#4fc3f7"],[1,"#4fc3f7"]],showscale:false,opacity:0.25,hoverinfo:"skip",name:"снеговая линия"});
  }
  const ax=t=>({title:t,color:"#ccc",backgroundcolor:"#0b0d14",gridcolor:"#2a2f3a"});
  const layout={title:{text:`${R.label}: ${L.title}, вертикальное преувеличение ${exag}×`,font:{color:"#eee",size:15},x:0.02},
    paper_bgcolor:"#05060a",margin:{l:0,r:10,t:50,b:10},font:{color:"#ddd"},showlegend:false,uirevision:key,
    scene:{xaxis:ax("долгота, ° в.д."),yaxis:ax("широта, °"),zaxis:ax("высота, км"),aspectmode:"manual",aspectratio:aspect(R,exag)}};
  if(key!==lastRegion) layout.scene.camera={eye:{x:-1.3,y:-1.5,z:0.9}};
  Plotly.react("terrain",traces,layout,{responsive:true});

  const mlat=R.lat.reduce((a,b)=>a+b,0)/R.lat.length;
  const top=[{type:"heatmap",x:R.lon,y:R.lat,z:C,colorscale:L.colorscale,zmin:L.cmin,zmax:L.cmax,colorbar:L.colorbar,hoverinfo:"skip"},
    {type:"contour",x:R.lon,y:R.lat,z:to2d(i=>isNaN(s[i])?0:s[i],nr,nc),contours:{start:thr,end:thr,size:1,coloring:"none"},
     line:{color:"white",width:2},showscale:false,hoverinfo:"skip",name:`граница снега, p = ${thr.toFixed(2)}`,showlegend:true}];
  if(plane) top.push({type:"contour",x:R.lon,y:R.lat,z:Z,contours:{start:level,end:level,size:1,coloring:"none"},
     line:{color:"#4fc3f7",width:1.5,dash:"dot"},showscale:false,hoverinfo:"skip",name:`изолиния снеговой линии, ${level.toFixed(2)} км`,showlegend:true});
  Plotly.react("top",top,{title:{text:`${R.label}: вид сверху`,font:{color:"#eee",size:15},x:0.02},
    paper_bgcolor:"#05060a",plot_bgcolor:"#05060a",margin:{l:50,r:10,t:50,b:40},font:{color:"#ddd"},uirevision:key,
    xaxis:{title:"долгота, ° в.д.",color:"#ccc"},yaxis:{title:"широта, °",color:"#ccc",scaleanchor:"x",scaleratio:1/Math.cos(mlat*Math.PI/180)},
    legend:{orientation:"h",y:-0.2}},{responsive:true});

  let aV=0,aS=0,aA=0,eA=0,nA=0,eB=0,nB=0;
  for(let i=0;i<G.n;i++){ if(!G.valid[i]) continue; const a=G.area[i]; aV+=a;
    if(s[i]>=thr) aS+=a;
    const ab=plane && G.elev[i]>=level;
    if(ab){aA+=a; if(!isNaN(G.emis[i])){eA+=G.emis[i];nA++;}} else if(!isNaN(G.emis[i])){eB+=G.emis[i];nB++;} }
  const rows=[["регион",R.label],["максимальная высота",`${fmt(R.emax,2)} км`],
    ["снеговая линия h_c (ячейка 6)",R.snowline!==null?`${fmt(R.snowline,2)} км`:"не выделена"],
    [`площадь снега при p >= ${thr.toFixed(2)}`,`${fmt(Math.round(aS),0)} км^2`],
    ["доля региона под снегом",`${fmt(100*aS/Math.max(aV,1),2)} %`],
    ["площадь выше плоскости",plane?`${fmt(Math.round(aA),0)} км^2`:"плоскость скрыта"],
    ["излучательная способность выше и ниже плоскости",plane&&nA?`${fmt(eA/nA,3)} и ${nB?fmt(eB/nB,3):"нет данных"}`:"плоскость скрыта"]];
  $("stats").innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join("");
  lastRegion=key;
  $("status").textContent=`построено за ${Math.round(performance.now()-t0)} мс`;
}
function fill(sel,opts,val){for(const [t,v] of opts){const o=document.createElement("option");o.textContent=t;o.value=v;sel.appendChild(o);}sel.value=val;}
const keys=Object.keys(D.regions);
fill($("region"),keys.map(k=>[D.regions[k].label,k]),keys[0]);
if(keys.length<2) $("regionbox").style.display="none";
fill($("layer"),D.layer_options,"elev");
fill($("source"),D.snow_options,"snow_prob");
$("thr").value=D.default_thr; $("exag").value=6; setLevelDefault();
$("region").addEventListener("change",()=>{setLevelDefault();draw();});
for(const id of ["layer","source","mode","show","plane","cont","thr","exag","level"]) $(id).addEventListener("change",draw);
for(const id of ["thr","exag","level"]) $(id).addEventListener("input",()=>{$("thrv").textContent=parseFloat($("thr").value).toFixed(2);$("exagv").textContent=$("exag").value;$("levelv").textContent=parseFloat($("level").value).toFixed(1);});
draw();
</script></body></html>
